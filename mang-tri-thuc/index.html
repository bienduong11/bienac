<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Mạng tri thức · Bienac</title>
  <meta name="description" content="Toàn bộ video của Bienac nối với nhau qua những khái niệm chung: chọn một chủ đề để thấy nó dẫn tới đâu." />
  <meta property="og:title" content="Mạng tri thức · Bienac" />
  <meta property="og:description" content="Các video của Bienac nối với nhau qua những khái niệm chung." />
  <meta property="og:image" content="https://bienac.com/assets/og/mang-tri-thuc.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/ung-dung.css" />
  <style>
    html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
    #net { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    .mt-head { position: fixed; left: clamp(16px, 4vw, 48px); top: 92px; z-index: 5; max-width: 360px; pointer-events: none; }
    .mt-head p.ud-dim { margin-top: 8px; font-size: .88rem; line-height: 1.5; }
    .mt-chips { position: fixed; left: clamp(16px, 4vw, 48px); right: clamp(16px, 4vw, 48px); bottom: 16px; z-index: 5; display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
    .mt-chip { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; font: 600 .74rem var(--display); color: var(--text); background: rgba(8,10,14,.8); border: 0; box-shadow: inset 0 0 0 1px var(--glass-border); cursor: pointer; }
    .mt-chip .han { color: var(--cinnabar); font-size: .95rem; }
    .mt-chip small { font: 500 .66rem var(--mono); color: var(--text-dim); }
    .mt-chip[aria-pressed="true"] { box-shadow: inset 0 0 0 1px var(--cyan); background: rgba(55,240,207,.12); }

    .mt-card { position: fixed; right: clamp(16px, 3vw, 40px); top: 92px; z-index: 6; width: min(360px, calc(100vw - 32px)); max-height: calc(100vh - 170px); overflow-y: auto; padding: 16px 18px 18px; display: none; }
    .mt-card.on { display: block; }
    .mt-card .x { position: absolute; right: 8px; top: 6px; background: none; border: 0; color: var(--text-dim); font-size: 1.3rem; cursor: pointer; }
    .mt-card h2 { font: 700 1.2rem/1.25 var(--display); margin: 6px 24px 10px 0; }
    .mt-card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; margin-bottom: 12px; }
    .mt-card .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .mt-card .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
    .mt-card a.ud-btn { text-decoration: none; display: inline-block; }
    .mt-card ul { list-style: none; display: grid; gap: 4px; }
    .mt-card li button { width: 100%; display: grid; grid-template-columns: 72px 1fr; gap: 10px; align-items: center; padding: 4px; text-align: left; background: none; border: 0; color: var(--text); font: 500 .85rem/1.3 'Be Vietnam Pro', sans-serif; cursor: pointer; }
    .mt-card li button:hover { background: rgba(55,240,207,.08); }
    .mt-card li img { width: 72px; margin: 0; }
    .mt-hint { position: fixed; left: 50%; top: 84px; transform: translateX(-50%); z-index: 4; font: 500 .66rem var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--text-dim); pointer-events: none; white-space: nowrap; }
    @media (max-width: 720px) {
      .mt-head { top: 76px; } .mt-head p.ud-dim, .mt-hint { display: none; }
      .mt-card { top: auto; bottom: 64px; max-height: 52vh; }
    }
  </style>
</head>
<body class="ud" data-nen="hat">
  <header class="site-header scrolled">
    <a class="brand" href="/">
      <span class="brand-logo"><img src="/assets/logo.svg" alt="logo Bienac" /></span>
      <span class="brand-name">Bienac</span>
    </a>
    <nav class="site-nav">
      <span class="nav-here">Mạng tri thức</span>
      <a class="nav-apps" href="/#apps" title="Tất cả mục" aria-label="Tất cả mục của Bienac">⊞</a>
      <a class="nav-cta" href="https://www.youtube.com/@bienac?sub_confirmation=1" target="_blank" rel="noopener">Đăng ký kênh</a>
    </nav>
  </header>

  <canvas id="net" aria-label="Mạng các video và khái niệm"></canvas>
  <div class="mt-head">
    <p class="ud-kicker">Mạng tri thức</p>
    <h1 class="ud-title">Mọi video <span class="accent">đều nối</span> với nhau</h1>
    <p class="ud-dim">Ô vuông là video, chấm tròn là khái niệm chung. Chạm vào một khái niệm để xem nó dẫn tới những video nào.</p>
  </div>
  <p class="mt-hint">Kéo để di chuyển · cuộn để thu phóng</p>
  <div class="mt-chips" id="chips"></div>
  <aside class="mt-card ud-panel" id="card" aria-live="polite"></aside>

<script>
(async () => {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const get = (u) => fetch(u).then((r) => (r.ok ? r.json() : null)).catch(() => null);
  const [videos, map, hoSo] = await Promise.all([get('/data/tat-ca-video.json'), get('/data/mang-tri-thuc.json'), get('/bai-viet/ho-so.json')]);
  if (!videos || !map) { $('card').classList.add('on'); $('card').textContent = 'Chưa tải được dữ liệu.'; return; }

  /* ------------------------------------------------------------ ĐỒ THỊ */
  const nodes = [], links = [], byId = {};
  for (const [k, c] of Object.entries(map.khai_niem)) {
    const n = { id: 'c:' + k, key: k, kind: 'c', name: c.ten, han: c.han || '', link: c.link, deg: 0 };
    nodes.push(n); byId[n.id] = n;
  }
  videos.forEach((v, i) => {
    const n = { id: 'v:' + v.id, vid: v.id, kind: 'v', name: v.title, i, deg: 0 };
    n.img = new Image(); n.img.src = `https://i.ytimg.com/vi/${v.id}/mqdefault.jpg`;
    nodes.push(n); byId[n.id] = n;
    for (const k of map.video[v.id] || []) {
      const c = byId['c:' + k]; if (!c) continue;
      links.push({ s: n, t: c }); n.deg++; c.deg++;
    }
  });
  // bỏ khái niệm chưa dùng
  for (let i = nodes.length - 1; i >= 0; i--) if (nodes[i].kind === 'c' && !nodes[i].deg) { delete byId[nodes[i].id]; nodes.splice(i, 1); }
  nodes.forEach((n, i) => { const a = i * 2.399; const r = 40 + 14 * Math.sqrt(i); n.x = Math.cos(a) * r; n.y = Math.sin(a) * r; n.vx = n.vy = 0; });

  const cv = $('net'), g = cv.getContext('2d');
  let W, H, DPR, cam = { x: 0, y: 0, k: 1 };
  function resize() { DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; cam.k = W < 720 ? W / 560 : Math.min(W, H) / 820; cam.x = W > 900 ? (W * 0.1) / cam.k : 0; }
  resize(); addEventListener('resize', resize);

  let alpha = 1;
  function tick() {
    if (alpha < 0.005) return;
    for (let i = 0; i < nodes.length; i++) {
      const a = nodes[i];
      for (let j = i + 1; j < nodes.length; j++) {
        const b = nodes[j];
        let dx = b.x - a.x, dy = b.y - a.y, d2 = dx * dx + dy * dy || 1;
        const f = (a.kind === 'c' && b.kind === 'c' ? 5200 : 2400) / d2 * alpha;
        const d = Math.sqrt(d2); dx /= d; dy /= d;
        a.vx -= dx * f; a.vy -= dy * f; b.vx += dx * f; b.vy += dy * f;
      }
    }
    for (const l of links) {
      const dx = l.t.x - l.s.x, dy = l.t.y - l.s.y, d = Math.hypot(dx, dy) || 1;
      const f = (d - 95) * 0.04 * alpha;
      l.s.vx += dx / d * f; l.s.vy += dy / d * f; l.t.vx -= dx / d * f; l.t.vy -= dy / d * f;
    }
    for (const n of nodes) {
      n.vx -= n.x * 0.003 * alpha * (n.deg ? 1 : 0.6); n.vy -= n.y * 0.003 * alpha * (n.deg ? 1 : 0.6);
      if (n === dragN) { n.vx = n.vy = 0; continue; }
      n.x += n.vx *= 0.6; n.y += n.vy *= 0.6;
    }
    alpha *= 0.985;
  }

  let sel = null, hover = null;
  const neigh = (n) => new Set(links.filter((l) => l.s === n || l.t === n).flatMap((l) => [l.s, l.t]));
  const toScreen = (n) => [W / 2 + (n.x + cam.x) * cam.k, H / 2 + (n.y + cam.y) * cam.k];
  const VW = 34, VH = 19;

  function draw() {
    tick();
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    g.clearRect(0, 0, W, H);
    const focus = sel || hover, near = focus ? neigh(focus) : null;
    // cạnh
    for (const l of links) {
      const on = near && near.has(l.s) && near.has(l.t) && (l.s === focus || l.t === focus);
      const [x1, y1] = toScreen(l.s), [x2, y2] = toScreen(l.t);
      g.strokeStyle = on ? 'rgba(55,240,207,.75)' : near ? 'rgba(201,166,80,.06)' : 'rgba(201,166,80,.2)';
      g.lineWidth = on ? 1.4 : 1;
      g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
    }
    // nút
    for (const n of nodes) {
      const [x, y] = toScreen(n), dim = near && !near.has(n);
      g.globalAlpha = dim ? 0.18 : 1;
      if (n.kind === 'c') {
        const r = (5 + Math.sqrt(n.deg) * 3) * Math.min(1.4, cam.k);
        g.fillStyle = n === focus ? '#e8452e' : 'rgba(232,69,46,.25)';
        g.strokeStyle = '#e8452e'; g.lineWidth = 1.2;
        g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); g.stroke();
        g.textAlign = 'center'; g.textBaseline = 'middle';
        if (n === focus || (near && near.has(n)) || (!near && (n.deg >= 3 || cam.k > 0.9))) {
          g.font = '600 12px "Chakra Petch", sans-serif'; g.fillStyle = '#ece6d6';
          g.fillText(n.name, x, y + r + 11);
        }
      } else {
        const k = Math.min(1.6, Math.max(0.8, cam.k)), w = VW * k, h = VH * k;
        if (n.img.complete && n.img.naturalWidth) g.drawImage(n.img, x - w / 2, y - h / 2, w, h);
        else { g.fillStyle = '#11151b'; g.fillRect(x - w / 2, y - h / 2, w, h); }
        g.strokeStyle = n === focus ? '#37f0cf' : n.deg ? 'rgba(201,166,80,.6)' : 'rgba(157,151,134,.35)';
        g.lineWidth = n === focus ? 2 : 1; g.strokeRect(x - w / 2, y - h / 2, w, h);
        if (n === focus || (near && near.has(n)) || cam.k > 1.6) {
          g.font = '500 11px "Be Vietnam Pro", sans-serif'; g.textAlign = 'center'; g.textBaseline = 'top';
          const t = n.name.length > 30 ? n.name.slice(0, 29) + '…' : n.name;
          const tw = g.measureText(t).width;
          g.fillStyle = 'rgba(6,7,11,.85)'; g.fillRect(x - tw / 2 - 4, y + h / 2 + 3, tw + 8, 16);
          g.fillStyle = '#ece6d6'; g.fillText(t, x, y + h / 2 + 5);
        }
      }
      g.globalAlpha = 1;
    }
    requestAnimationFrame(draw);
  }

  function pick(mx, my) {
    let best = null, bd = 1e9;
    for (const n of nodes) {
      const [x, y] = toScreen(n), d = Math.hypot(mx - x, my - y);
      const r = n.kind === 'c' ? 18 : 22;
      if (d < r && d < bd) { bd = d; best = n; }
    }
    return best;
  }

  /* -------------------------------------------------------- TƯƠNG TÁC */
  let dragN = null, pan = null, moved = false;
  const pts = new Map();
  cv.addEventListener('pointerdown', (e) => {
    cv.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]); moved = false;
    const n = pick(e.clientX, e.clientY);
    if (n) { dragN = n; alpha = Math.max(alpha, 0.3); } else pan = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y };
  });
  cv.addEventListener('pointermove', (e) => {
    const prev = pts.get(e.pointerId);
    if (pts.size === 2 && prev) {
      const [a, b] = [...pts.values()], d0 = Math.hypot(a[0] - b[0], a[1] - b[1]);
      pts.set(e.pointerId, [e.clientX, e.clientY]);
      const [c, d] = [...pts.values()], d1 = Math.hypot(c[0] - d[0], c[1] - d[1]);
      cam.k = Math.max(0.3, Math.min(4, cam.k * d1 / (d0 || 1))); moved = true; return;
    }
    if (prev) pts.set(e.pointerId, [e.clientX, e.clientY]);
    if (dragN) { dragN.x = (e.clientX - W / 2) / cam.k - cam.x; dragN.y = (e.clientY - H / 2) / cam.k - cam.y; moved = true; alpha = Math.max(alpha, 0.2); }
    else if (pan) { cam.x = pan.cx + (e.clientX - pan.x) / cam.k; cam.y = pan.cy + (e.clientY - pan.y) / cam.k; if (Math.abs(e.clientX - pan.x) + Math.abs(e.clientY - pan.y) > 4) moved = true; }
    else { const n = pick(e.clientX, e.clientY); hover = n; cv.style.cursor = n ? 'pointer' : 'grab'; }
  });
  cv.addEventListener('pointerup', (e) => {
    pts.delete(e.pointerId);
    if (!moved) select(pick(e.clientX, e.clientY));
    dragN = null; pan = null;
  });
  cv.addEventListener('wheel', (e) => { e.preventDefault(); cam.k = Math.max(0.3, Math.min(4, cam.k * (e.deltaY < 0 ? 1.12 : 0.89))); }, { passive: false });

  const card = $('card');
  function select(n) {
    sel = n;
    document.querySelectorAll('.mt-chip').forEach((c) => c.setAttribute('aria-pressed', String(n && c.dataset.id === n.id)));
    if (!n) { card.classList.remove('on'); history.replaceState(null, '', location.pathname); return; }
    card.classList.add('on');
    const close = '<button class="x" aria-label="Đóng">×</button>';
    if (n.kind === 'v') {
      const cs = links.filter((l) => l.s === n).map((l) => l.t);
      const hs = hoSo && hoSo[n.vid];
      card.innerHTML = `${close}<p class="ud-kicker">Video</p><h2>${esc(n.name)}</h2>
        <img src="https://i.ytimg.com/vi/${n.vid}/hqdefault.jpg" alt="" />
        <div class="tags">${cs.map((c) => `<button class="mt-chip" data-id="${c.id}">${esc(c.name)}</button>`).join('') || '<span class="ud-dim">Chưa gắn khái niệm.</span>'}</div>
        <div class="acts"><a class="ud-btn" href="https://www.youtube.com/watch?v=${n.vid}" target="_blank" rel="noopener">Xem trên YouTube</a>${hs ? `<a class="ud-btn" href="${hs}">Nguồn & bài đọc</a>` : ''}</div>`;
      history.replaceState(null, '', '#v=' + n.vid);
    } else {
      const vs = links.filter((l) => l.t === n).map((l) => l.s);
      card.innerHTML = `${close}<p class="ud-kicker">Khái niệm · ${vs.length} video</p><h2>${esc(n.name)}</h2>
        ${n.link ? `<div class="acts" style="margin-bottom:12px"><a class="ud-btn" href="${n.link}">Mở ứng dụng liên quan</a></div>` : ''}
        <ul>${vs.map((v) => `<li><button data-id="${v.id}"><img src="https://i.ytimg.com/vi/${v.vid}/mqdefault.jpg" alt="" />${esc(v.name)}</button></li>`).join('')}</ul>`;
      history.replaceState(null, '', '#k=' + n.key);
    }
    card.querySelector('.x').onclick = () => select(null);
    card.querySelectorAll('[data-id]').forEach((b) => (b.onclick = () => select(byId[b.dataset.id])));
  }

  // hàng chip khái niệm
  const chips = $('chips');
  nodes.filter((n) => n.kind === 'c').sort((a, b) => b.deg - a.deg).forEach((n) => {
    const b = document.createElement('button');
    b.className = 'mt-chip'; b.dataset.id = n.id; b.setAttribute('aria-pressed', 'false');
    b.innerHTML = `${esc(n.name)} <small>${n.deg}</small>`;
    b.onclick = () => select(sel === n ? null : n);
    chips.appendChild(b);
  });

  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('k')) select(byId['c:' + h.get('k')] || null);
  if (h.get('v')) select(byId['v:' + h.get('v')] || null);
  addEventListener('keydown', (e) => { if (e.key === 'Escape') select(null); });
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
