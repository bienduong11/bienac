  const cv = document.getElementById('tvt'), g = cv.getContext('2d');
  let W = 0, H = 0, DPR = 1;
  let z = Math.log10(1.7), zt = z;          // bậc hiện tại / bậc đích (mượt)
  let touring = false;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function resize() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    buildRail();
  }

  // Tâm vòng tròn: lệch phải một chút để chừa chỗ cho bảng chữ
  const center = () => [W < 720 ? W * 0.5 : W * 0.58, W < 720 ? H * 0.5 : H * 0.54];
  const base = () => Math.min(W, H) * (W < 720 ? 0.3 : 0.27);   // bán kính của vật "đang xem"

  // Sao nền cố định
  const STARS = Array.from({ length: 160 }, (_, i) => [Math.random(), Math.random(), Math.random()]);

  function draw() {
    z += (zt - z) * (reduce ? 1 : 0.12);
    const [cx, cy] = center(), B = base(), D = Math.hypot(W, H);
    g.clearRect(0, 0, W, H);

    // Nền: sao mờ dần khi đi vào vi mô
    const sa = Math.max(0, Math.min(1, (z - 4) / 8)) * 0.8 + 0.12;
    for (const [x, y, b] of STARS) {
      g.fillStyle = `rgba(236,230,214,${(sa * b * 0.6).toFixed(3)})`;
      g.fillRect(x * W, y * H, b > 0.8 ? 1.6 : 1, b > 0.8 ? 1.6 : 1);
    }

    // Vòng lũy thừa 10
    g.lineWidth = 1;
    for (let n = Math.floor(z) - 3; n <= Math.ceil(z) + 4; n++) {
      if (n < ZMIN || n > ZMAX) continue;
      const R = B * Math.pow(10, n - z);
      if (R < 10 || R > D) continue;
      const a = Math.min(1, (R - 10) / 60) * Math.min(1, (D - R) / (D * 0.4));
      g.strokeStyle = `rgba(201,166,80,${(0.22 * a).toFixed(3)})`;
      g.setLineDash(n % 3 === 0 ? [] : [2, 6]);
      g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2); g.stroke();
      if (R > 40) {
        g.fillStyle = `rgba(201,166,80,${(0.6 * a).toFixed(3)})`;
        g.font = '500 10px "JetBrains Mono", monospace'; g.textAlign = 'left'; g.textBaseline = 'middle';
        g.fillText(`10${sup(n)} m`, cx + R + 6, cy);
      }
    }
    g.setLineDash([]);

    // Vật thể
    let near = null, nd = 1e9;
    OBJ.forEach((o, i) => {
      const R = B * Math.pow(10, Math.log10(o.s) - z);
      const d = Math.abs(Math.log10(o.s) - z);
      if (d < nd) { nd = d; near = o; }
      if (R < 3 || R > D * 1.2) return;
      const fadeIn = Math.min(1, (R - 3) / 40), fadeOut = Math.min(1, (D * 1.2 - R) / (D * 0.6));
      const a = fadeIn * fadeOut;
      const col = CAT[o.c][1];
      g.globalAlpha = a;
      g.strokeStyle = col; g.lineWidth = o === near ? 1.6 : 1;
      g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2); g.stroke();
      // nhãn trên vòng, góc so le để không chồng nhau
      const ang = -Math.PI / 2 - 0.5 - (i % 4) * 0.32;
      const px = cx + Math.cos(ang) * R, py = cy + Math.sin(ang) * R;
      if (R > 14 && px > -50 && py > -20 && px < W + 50 && py < H + 20) {
        const lx = px - 18, ly = py - 14;
        g.beginPath(); g.moveTo(px, py); g.lineTo(lx, ly); g.lineTo(lx - 10, ly); g.stroke();
        g.beginPath(); g.arc(px, py, 2.2, 0, Math.PI * 2); g.fillStyle = col; g.fill();
        g.font = '600 12px "Chakra Petch", sans-serif'; g.textAlign = 'right'; g.textBaseline = 'middle';
        g.fillStyle = '#ece6d6'; g.fillText(o.n, lx - 14, ly);
      }
      g.globalAlpha = 1;
    });

    // tâm
    g.fillStyle = '#37f0cf'; g.beginPath(); g.arc(cx, cy, 1.6, 0, Math.PI * 2); g.fill();

    updateHud(near);
    requestAnimationFrame(draw);
  }

  /* ------------------------------------------------------------- HUD */
  const $ = (id) => document.getElementById(id);
  let lastNear = null, lastK = null, lastZ = null;
  function sizeText(m) {
    const ex = Math.floor(Math.log10(m));
    let p = PREF[0];
    for (const q of PREF) if (q[0] <= ex) p = q;
    if (ex >= 15) {
      const ly = m / 9.461e15;
      return `${fmt(ly)} năm ánh sáng`;
    }
    if (ex >= 3 && ex < 15) {
      const km = m / 1000;
      return `${fmt(km)} km`;
    }
    return `${fmt(m / Math.pow(10, p[0]))} ${p[1]}m`;
  }
  function updateHud(near) {
    const zr = Math.round(z * 100) / 100;
    if (zr !== lastZ) {
      lastZ = zr;
      const n = Math.floor(z), m = Math.pow(10, z);
      $('exp').innerHTML = `10<sup>${n}</sup><small>mét</small>`;
      const lt = m / 2.998e8;
      let light = '';
      if (z > 7.5) {
        light = lt < 60 ? `${fmt(lt, 2)} giây` : lt < 3600 ? `${fmt(lt / 60, 2)} phút` : lt < 86400 * 2 ? `${fmt(lt / 3600, 2)} giờ` : lt < 3.156e7 ? `${fmt(lt / 86400, 2)} ngày` : `${fmt(lt / 3.156e7, 2)} năm`;
        light = `<br>ánh sáng đi mất <b>${light}</b>`;
      }
      $('alt').innerHTML = `≈ <b>${sizeText(m)}</b>${light}`;
      $('rail').setAttribute('aria-valuenow', zr);
      $('rail').querySelector('.knob').style.top = `${((ZMAX - z) / (ZMAX - ZMIN)) * 100}%`;
    }
    const k = Math.round(z);
    const e = EAST[k] && Math.abs(z - k) < 0.45 ? k : null;
    if (e !== lastK) {
      lastK = e;
      const box = $('east');
      if (e === null) box.classList.remove('on');
      else {
        const [han, hv] = EAST[e];
        $('eg').textContent = han;
        $('en').innerHTML = `1 ${hv} mét <span>10${sup(e)}</span>`;
        $('ep').textContent = EAST_NOTE[e] || (e < 0 ? `Đơn vị cổ: mỗi bậc nhỏ hơn bậc trước 10 lần.` : `Đơn vị cổ theo hệ vạn tiến.`);
        box.classList.add('on');
      }
    }
    if (near !== lastNear) {
      lastNear = near;
      $('ck').textContent = CAT[near.c][0];
      $('ck').style.color = CAT[near.c][1];
      $('cs').textContent = sizeText(near.s);
      $('cn').textContent = near.n;
      $('cf').textContent = near.f;
    }
  }

  /* ------------------------------------------------------------ RAIL */
  function buildRail() {
    const r = $('rail');
    r.innerHTML = '';
    for (let n = ZMIN; n <= ZMAX; n++) {
      const t = document.createElement('span');
      const top = ((ZMAX - n) / (ZMAX - ZMIN)) * 100;
      t.className = 't' + (n % 5 === 0 ? ' big' : '');
      t.style.top = top + '%';
      r.appendChild(t);
      if (n % 5 === 0 || n === ZMAX || n === ZMIN) {
        const l = document.createElement('span');
        l.className = 'l'; l.style.top = top + '%'; l.textContent = `10${sup(n)}`;
        r.appendChild(l);
      }
    }
    const k = document.createElement('span'); k.className = 'knob'; r.appendChild(k);
    lastZ = null;
  }

  const clamp = (v) => Math.max(ZMIN, Math.min(ZMAX, v));
  const setZ = (v) => { zt = clamp(v); };
  const stopTour = () => { touring = false; $('tour').setAttribute('aria-pressed', 'false'); $('tour').textContent = '▶ Du hành'; };
  const hideHint = () => { $('hint').style.opacity = 0; };

  addEventListener('wheel', (e) => { e.preventDefault(); stopTour(); hideHint(); setZ(zt - e.deltaY * (e.deltaMode ? 0.05 : 0.0022)); }, { passive: false });

  // Kéo trên nền: kéo lên = phóng to (đi ra vũ trụ)
  let drag = null;
  cv.addEventListener('pointerdown', (e) => { drag = { y: e.clientY, z: zt }; cv.setPointerCapture(e.pointerId); stopTour(); hideHint(); });
  cv.addEventListener('pointermove', (e) => { if (drag) setZ(drag.z + (drag.y - e.clientY) / (H / 9)); });
  cv.addEventListener('pointerup', () => { drag = null; });
  cv.addEventListener('pointercancel', () => { drag = null; });

  // Kéo trên thanh thước
  const rail = $('rail');
  const railZ = (y) => { const r = rail.getBoundingClientRect(); return ZMAX - ((y - r.top) / r.height) * (ZMAX - ZMIN); };
  rail.addEventListener('pointerdown', (e) => { rail.setPointerCapture(e.pointerId); stopTour(); hideHint(); setZ(railZ(e.clientY)); rail.dragging = true; });
  rail.addEventListener('pointermove', (e) => { if (rail.dragging) setZ(railZ(e.clientY)); });
  rail.addEventListener('pointerup', () => { rail.dragging = false; });

  addEventListener('keydown', (e) => {
    const step = e.shiftKey ? 0.1 : 0.5;
    if (e.key === 'ArrowUp' || e.key === 'PageUp') { setZ(zt + step); stopTour(); e.preventDefault(); }
    if (e.key === 'ArrowDown' || e.key === 'PageDown') { setZ(zt - step); stopTour(); e.preventDefault(); }
    if (e.key === 'Home') setZ(ZMIN);
    if (e.key === 'End') setZ(ZMAX);
  });

  $('home').onclick = () => { stopTour(); setZ(Math.log10(1.7)); };
  $('tour').onclick = () => {
    if (touring) return stopTour();
    touring = true; $('tour').setAttribute('aria-pressed', 'true'); $('tour').textContent = '❚❚ Dừng';
    hideHint();
    if (zt > ZMAX - 0.5) zt = z = ZMIN;
    let last = performance.now();
    const step = (t) => {
      if (!touring) return;
      const dt = (t - last) / 1000; last = t;
      zt = clamp(zt + dt * 0.75);           // ~80 giây cho cả hành trình
      if (zt >= ZMAX) return stopTour();
      requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  };

  // Mở thẳng một bậc bằng #10^-10 hoặc #-10
  const h = decodeURIComponent(location.hash.replace('#', '')).replace('10^', '');
  if (h && !isNaN(+h)) z = zt = clamp(+h);

  addEventListener('resize', resize);
  resize();
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
