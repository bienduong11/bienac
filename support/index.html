  <style>
    .sp { max-width: 820px; margin: 0 auto; padding: 100px clamp(14px, 4vw, 32px) 64px; }
    .sp-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .sp-lang { background: none; border: 1px solid rgba(236,230,214,.2); color: var(--text-dim); border-radius: 999px; padding: 6px 14px; font: 600 .78rem var(--label); cursor: pointer; }
    .sp-card { padding: 20px; margin-top: 16px; }
    .sp-card h2 { font: 700 1.12rem/1.3 var(--display); margin-bottom: 6px; }
    .sp-card p { font-size: .9rem; line-height: 1.6; color: var(--text-dim); }
    .sp-link { background: none; border: 0; color: var(--cyan); font-size: .85rem; cursor: pointer; padding: 10px 0 0; text-decoration: underline; }
    .sp-acc { display: grid; grid-template-columns: 200px 1fr; gap: 20px; align-items: center; }
    .sp-acc > a { text-decoration: none; }
    .sp-acc > a img { width: 200px; height: 200px; object-fit: contain; background: #fff; border-radius: 16px; padding: 8px; display: block; }
    @media (max-width: 560px) { .sp-acc { grid-template-columns: 1fr; justify-items: center; text-align: center; } .sp-acc > a img { width: 220px; height: 220px; } }
    .sp-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
    @media (max-width: 560px) { .sp-row { justify-content: center; } }
    .sp-num { font: 600 1.15rem var(--mono); color: var(--text); letter-spacing: .03em; }
    .sp-copy { border: 1px solid rgba(55,240,207,.4); background: rgba(55,240,207,.08); color: var(--cyan); border-radius: 999px; padding: 6px 14px; font: 600 .76rem var(--label); cursor: pointer; }
    .sp-btns { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; }
    .sp-btns .btn { padding: 10px 18px; font-size: .84rem; }
    .sp-story p + p { margin-top: 10px; }
    .sp-sign { margin-top: 12px !important; text-align: right; font-style: italic; color: var(--text) !important; }
    .sp-list { margin-top: 16px; display: grid; gap: 10px; }
    .sp-pay { display: block; padding: 16px 20px; border-radius: 16px; text-align: center; text-decoration: none; font: 600 1rem 'Be Vietnam Pro', sans-serif; color: var(--text); background: var(--glass); box-shadow: inset 0 0 0 1px var(--glass-border); }
    .sp-pay:hover, .sp-pay:focus-visible { color: var(--cyan); box-shadow: inset 0 0 0 1px var(--cyan); }
    [hidden] { display: none !important; }
  </style>
</head>
<body class="ud" data-nen="sao">
  <header class="site-header scrolled">
    <a class="brand" href="/">
      <span class="brand-logo"><img src="/assets/logo-192.webp" alt="logo Bienac" /></span>
      <span class="brand-name">Bienac</span>
    </a>
    <nav class="site-nav">
      <span class="nav-here" data-t="here">Ủng hộ</span>
      <a class="nav-apps" href="/#apps" title="Tất cả mục" aria-label="Tất cả mục của Bienac">⊞</a>
      <a class="nav-cta" href="https://www.youtube.com/@bienac?sub_confirmation=1" target="_blank" rel="noopener" data-t="sub">Đăng ký kênh</a>
    </nav>
  </header>

  <main class="sp">
    <div class="sp-top">
      <p class="ud-kicker" data-t="kicker">Ủng hộ</p>
      <button class="sp-lang" id="lang" type="button">English</button>
    </div>
    <h1 class="ud-title" data-t="title">Cùng Bienac <span class="accent">đi xa hơn</span></h1>

    <section class="ud-panel sp-card" id="acc">
      <div class="sp-acc">
        <a href="/assets/qr-bidv.png" target="_blank" rel="noopener" id="qr-link" download="Bienac-QR-BIDV.png"><img id="qr" src="/assets/qr-bidv.svg" alt="Mã QR chuyển khoản BIDV" width="200" height="200" fetchpriority="high" /></a>
        <div>
          <div class="sp-row"><span class="sp-num" id="num">BIDV · 4506 285 887</span><button class="sp-copy" type="button" data-copy="num" data-t="copy">Sao chép</button></div>
          <div class="sp-row"><span id="holder" style="font:600 .9rem var(--label);letter-spacing:.04em">DUONG VAN BIEN</span></div>
        </div>
      </div>
    </section>

    <nav class="sp-list" aria-label="Cách ủng hộ khác">
      <a class="sp-pay" href="https://me.momo.vn/bienac" target="_blank" rel="noopener" data-tap="momo">MoMo</a>
      <a class="sp-pay" href="https://paypal.me/bienac" target="_blank" rel="noopener" data-tap="paypal">PayPal</a>

      <p data-t="story">Nếu câu chuyện mình kể mang lại giá trị cho bạn, bạn có thể ủng hộ để giúp kênh duy trì. Cảm ơn bạn đã xem, đã ở lại, và đi cùng Bienac.</p>
      <p class="sp-sign">Biên</p>
    </section>
  </main>

  <footer class="site-footer"><p>© <span id="y"></span> Bienac.</p></footer>

<script src="/js/vendor/qrcode-generator.min.js"></script>
<script>
(() => {
  /* ---- Thông tin tài khoản: sửa ở đây (link MoMo/PayPal/Hội viên sửa thẳng trong HTML ở trên) ---- */
  const ACC = { bank: 'bidv', bankName: 'BIDV', number: '4506285887', holder: 'DUONG VAN BIEN' };
  // 26/11/2026 (Bien quyết): bỏ lưới ngân hàng và deeplink VietQR. Trang chỉ còn: mã QR + số tài khoản, MoMo, PayPal, Hội viên (26/11: bỏ Patreon theo Bien).
  const T = {
    vi: { here: 'Ủng hộ', sub: 'Đăng ký kênh', kicker: 'Ủng hộ', title: 'Cùng Bienac <span class="accent">đi xa hơn</span>',
      story: 'Nếu câu chuyện mình kể mang lại giá trị cho bạn, bạn có thể ủng hộ để giúp kênh duy trì. Cảm ơn bạn đã xem, đã ở lại, và đi cùng Bienac.',
      copy: 'Sao chép', copied: 'Đã chép ✓', member: 'Hội viên', lang: 'English' },
    en: { here: 'Support', sub: 'Subscribe', kicker: 'Support', title: 'Help Bienac <span class="accent">go further</span>',
      story: 'If the stories I tell bring you something of value, you can support the channel to help keep it going. Thank you for watching, for staying, and for coming along with Bienac.',
      copy: 'Copy', copied: 'Copied ✓', member: 'Membership', lang: 'Tiếng Việt' },
  };
  const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
  const $ = (id) => document.getElementById(id);

  /* ---- Ngôn ngữ: ?lang= > lựa chọn đã lưu > ngôn ngữ trình duyệt ---- */
  const qs = new URLSearchParams(location.search).get('lang');
  let lang = qs === 'en' || qs === 'vi' ? qs : store.get('bienac-lang') || ((navigator.language || 'vi').toLowerCase().startsWith('vi') ? 'vi' : 'en');
  const t = (k) => T[lang][k] || T.vi[k] || '';

  /* Chép đồng bộ trước (giữ được "lần chạm" của người dùng, iPhone cần điều này), rồi chép thêm bằng API mới. */
  function copySync(text) {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;font-size:16px';
      document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);
      const ok = document.execCommand('copy'); ta.remove(); return ok;
    } catch { return false; }
  }
  async function copy(text) {
    const ok = copySync(text);
    try { await navigator.clipboard.writeText(text); return true; } catch { return ok; }
  }

  /* Mã VietQR tạo ngay trên trang, chỉ kèm số tài khoản: app ngân hàng nào quét cũng tự điền ngân hàng, số tài khoản, tên;
     người xem tự nhập số tiền và lời nhắn. Thư viện không tải được thì giữ ảnh tĩnh /assets/qr-bidv.svg. */
  const tlv = (id, v) => id + String(v.length).padStart(2, '0') + v;
  function crc16(str) { let c = 0xffff; for (const ch of new TextEncoder().encode(str)) { c ^= ch << 8; for (let i = 0; i < 8; i++) c = c & 0x8000 ? ((c << 1) ^ 0x1021) & 0xffff : (c << 1) & 0xffff; } return c.toString(16).toUpperCase().padStart(4, '0'); }
  function vietqr() {
    const acc = tlv('00', 'A000000727') + tlv('01', tlv('00', '970418') + tlv('01', ACC.number)) + tlv('02', 'QRIBFTTA');
    const p = tlv('00', '01') + tlv('01', '11') + tlv('38', acc) + tlv('53', '704') + tlv('58', 'VN') + '6304';
    return p + crc16(p);
  }
  let qrSvg = '';
  function renderQR() {
    if (qrSvg || typeof window.qrcode !== 'function' || ACC.bank !== 'bidv') return;
    try {
      const q = window.qrcode(0, 'M'); q.addData(vietqr()); q.make();
      qrSvg = q.createSvgTag({ cellSize: 8, margin: 4, scalable: true });
      $('qr').src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(qrSvg);
    } catch {}
  }
  // Tải ảnh: xuất đúng mã đang hiện ra PNG (app ngân hàng quét từ thư viện ảnh không đọc SVG).
  $('qr-link').addEventListener('click', (e) => {
    if (!qrSvg) return;
    e.preventDefault();
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = c.height = 720;
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, 720, 720); g.drawImage(img, 0, 0, 720, 720);
      c.toBlob((b) => {
        const a = document.createElement('a'); a.href = URL.createObjectURL(b);
        a.download = 'Bienac-QR-BIDV.png'; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      }, 'image/png');
    };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(qrSvg);
  });

  /* Đếm lượt chạm (MoMo, PayPal, Hội viên, sao chép, tải QR): /support/tap/<tên> */
  const tap = (what) => { try { navigator.sendBeacon('/api/hit', JSON.stringify({ p: '/support/tap/' + what, r: document.referrer })); } catch {} };
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-tap], [data-copy], #qr-link');
    if (!el) return;
    tap(el.dataset.tap || (el.id === 'qr-link' ? 'qr' : 'copy-' + el.dataset.copy));
  }, true);
  document.querySelectorAll('[data-copy]').forEach((b) => b.addEventListener('click', async () => {
    const ok = await copy(ACC.number);
    if (ok) { b.textContent = t('copied'); setTimeout(() => (b.textContent = t('copy')), 1600); }
  }));

  function applyLang() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-t]').forEach((el) => { const v = t(el.dataset.t); if (v) el.innerHTML = v; });
    $('lang').textContent = t('lang');
    renderQR();
  }
  $('lang').onclick = () => { lang = lang === 'vi' ? 'en' : 'vi'; store.set('bienac-lang', lang); applyLang(); };
  $('y').textContent = new Date().getFullYear();
  $('num').textContent = `${ACC.bankName} · ${ACC.number.replace(/(\d{4})(\d{3})(\d+)/, '$1 $2 $3')}`;
  applyLang();
})();
</script>
<script src="/js/dem.js"></script>
<script src="/js/nen-ung-dung.js"></script>
</body>
