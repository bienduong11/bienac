    [1905, 'w', 'Einstein: năm kỳ diệu', 'Bốn bài báo về quang điện, chuyển động Brown, thuyết tương đối hẹp và E = mc².'],
    [1911, 'e', 'Cách mạng Tân Hợi', 'Chấm dứt hơn hai nghìn năm chế độ quân chủ ở Trung Hoa.'],
    [1945, 'e', 'Tuyên ngôn độc lập', 'Ngày 2 tháng 9, Quảng trường Ba Đình.'],
    [1969, 'w', 'Apollo 11 lên Mặt Trăng', 'Con người lần đầu đặt chân lên một thiên thể khác.'],
    [1975, 'e', 'Thống nhất đất nước', 'Ngày 30 tháng 4.'],
    [1986, 'e', 'Đổi Mới', 'Đại hội VI mở đường cho kinh tế thị trường.'],
    [1989, 'w', 'Bức tường Berlin sụp đổ', 'Chiến tranh Lạnh đi tới hồi kết.'],
    [1991, 'w', 'World Wide Web', 'Tim Berners-Lee đưa trang web đầu tiên lên mạng tại CERN.'],
  ];

  const YMIN = -3300, YMAX = 2030;
  const $ = (id) => document.getElementById(id);
  const wrap = $('wrap'), stage = $('stage');
  let ppy = 0.3;                    // điểm ảnh mỗi năm
  let cursorYear = 1010;
  const yTxt = (y) => (y < 0 ? `${-y} TCN` : `${y}`);
  const xOf = (y) => 40 + (y - YMIN) * ppy;
  const yearAt = (x) => YMIN + (x - 40) / ppy;

  function layout() {
    const H = wrap.clientHeight, W = xOf(YMAX) + 60;
    stage.style.width = W + 'px';
    stage.innerHTML = '';
    const mid = Math.round(H / 2);
    const rowY = { vn: mid - 52, cn: mid - 26, eu: mid + 6, ne: mid + 32 };   // dải triều đại sát trục
    const evTopMax = mid - 64, evBotMin = mid + 66;

    // tên hàng (dính bên trái)
    const names = document.createElement('div');
    names.style.cssText = `position:sticky;left:0;top:0;width:0;height:0;z-index:4;`;
    ROWS.forEach((r) => {
      const n = document.createElement('div');
      n.className = 'dt-lane-name'; n.style.cssText = `position:absolute;top:${rowY[r.id] - 1}px;`;
      n.innerHTML = `${r.name}`;
      names.appendChild(n);
    });

    // dải triều đại
    BANDS.forEach((b) => {
      const [row, a, z, t, ghost] = b;
      const el = document.createElement('div');
      const side = ROWS.find((r) => r.id === row).side;
      el.className = `dt-band ${side}${ghost ? ' ghost' : ''}`;
      el.style.left = xOf(a) + 'px'; el.style.width = Math.max(2, (z - a) * ppy - 1) + 'px';
      el.style.top = rowY[row] + 'px';
      el.textContent = (z - a) * ppy > 28 ? t : '';
      el.title = `${t}: ${yTxt(a)} – ${yTxt(z)}`;
      el._b = b;
      stage.appendChild(el);
    });

    // trục năm
    const ax = document.createElement('div'); ax.className = 'dt-axis'; ax.style.top = (mid - 1) + 'px'; stage.appendChild(ax);
    const step = ppy > 1.5 ? 50 : ppy > 0.6 ? 100 : ppy > 0.25 ? 250 : 500;
    for (let y = Math.ceil(YMIN / step) * step; y <= YMAX; y += step) {
      const t = document.createElement('div');
      t.className = 'dt-tick dn'; t.style.left = xOf(y) + 'px'; t.style.top = (mid + 1) + 'px';
      t.style.transform = 'translate(-50%, -2px)'; t.style.display = 'none';
      stage.appendChild(t);
    }
    const yLabelRow = mid - 6;
    for (let y = Math.ceil(YMIN / step) * step; y <= YMAX; y += step) {
      const t = document.createElement('div');
      t.className = 'dt-tick'; t.style.left = xOf(y) + 'px'; t.style.top = (yLabelRow - 2) + 'px';
      t.textContent = y === 0 ? 'CN' : yTxt(y);
      t.style.cssText += 'background:rgba(6,7,11,.9);padding:0 4px;';
      stage.appendChild(t);
    }

    // sự kiện: xếp tầng tham lam để nhãn không chồng nhau
    const measure = document.createElement('span');
    measure.style.cssText = 'position:absolute;visibility:hidden;font:500 .76rem "Be Vietnam Pro",sans-serif;white-space:nowrap';
    document.body.appendChild(measure);
    const levels = { e: [], w: [] };
    const gap = 22;
    const maxLv = { e: Math.max(1, Math.floor((evTopMax - 20) / gap)), w: Math.max(1, Math.floor((H - evBotMin - 14) / gap)) };
    const pos = new Map();
    [...EV].sort((a, b) => a[0] - b[0]).forEach((ev) => {
      const [y, s, title] = ev;
      measure.textContent = title;
      const x = xOf(y), w = measure.offsetWidth + 24;
      const L = levels[s];
      let lv = L.findIndex((end) => end < x);
      if (lv === -1 && L.length < maxLv[s]) { lv = L.length; L.push(0); }
      const el = document.createElement('button');
      el.className = `dt-ev ${s}`;
      el.innerHTML = `<i></i><span>${title}</span>`;
      el.title = `${yTxt(y)} · ${title}`;
      let top;
      if (lv === -1) { el.classList.add('nolabel'); lv = 0; top = s === 'e' ? evTopMax : evBotMin; }
      else { L[lv] = x + w; top = s === 'e' ? evTopMax - lv * gap : evBotMin + lv * gap; }
      el.style.left = x + 'px'; el.style.top = (top - 8) + 'px';
      el.onclick = (e) => { e.stopPropagation(); setCursor(y, ev); };
      // đường dóng xuống trục
      const st = document.createElement('div'); st.className = 'dt-stem';
      st.style.left = x + 'px';
      if (s === 'e') { st.style.top = top + 'px'; st.style.height = (mid - top) + 'px'; }
      else { st.style.top = mid + 'px'; st.style.height = (top - mid) + 'px'; }
      stage.appendChild(st); stage.appendChild(el);
      pos.set(ev, [x, top]);
      el._ev = ev;
    });
    measure.remove();

    // cung nối các cặp phát minh Đông ↔ Tây
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'dt-pairs'); svg.setAttribute('width', W); svg.setAttribute('height', H);
    const keys = {};
    EV.forEach((ev) => { if (ev[4]) (keys[ev[4]] = keys[ev[4]] || []).push(ev); });
    Object.values(keys).forEach((pair) => {
      if (pair.length !== 2) return;
      const [a, b] = pair.map((ev) => pos.get(ev));
      const p = document.createElementNS(svg.namespaceURI, 'path');
      const cx = (a[0] + b[0]) / 2;
      p.setAttribute('d', `M${a[0]},${a[1]} C${cx},${a[1]} ${cx},${b[1]} ${b[0]},${b[1]}`);
      svg.appendChild(p);
    });
    stage.appendChild(svg);

    const cur = document.createElement('div'); cur.className = 'dt-cursor'; cur.id = 'cur'; cur.innerHTML = '<b></b>';
    stage.appendChild(cur);
    stage.prepend(names);
    setCursor(cursorYear, null, true);
  }

  function nearest(side, y) {
    return EV.filter((e) => e[1] === side).map((e) => [Math.abs(e[0] - y), e]).sort((a, b) => a[0] - b[0])[0][1];
  }
  function bandsAt(side, y) {
    return BANDS.filter((b) => ROWS.find((r) => r.id === b[0]).side === side && b[1] <= y && y < b[2]);
  }
  function describe(side, y, picked) {
    const bs = bandsAt(side, y);
    const now = bs.length ? bs.map((b) => `<em>${b[3]}</em>`).join(' · ') : '<em>—</em>';
    const ev = picked && picked[1] === side ? picked : nearest(side, y);
    const d = ev[0] - y;
    const when = d === 0 ? 'Năm này' : d > 0 ? `${d} năm sau` : `${-d} năm trước`;
    let pair = '';
    if (ev[4]) {
      const o = EV.find((x) => x[4] === ev[4] && x !== ev);
      if (o) pair = ` <span class="pair">⇄ phía bên kia: ${o[2]} (${yTxt(o[0])}).</span>`;
    }
    return [now, `<b>${when} · ${yTxt(ev[0])}: ${ev[2]}.</b> ${ev[3]}${pair}`];
  }

  function setCursor(y, picked, quiet) {
    cursorYear = Math.round(y);
    const cur = $('cur');
    if (cur) { cur.style.left = xOf(cursorYear) + 'px'; cur.querySelector('b').textContent = cursorYear === 0 ? 'năm 1' : yTxt(cursorYear); }
    stage.querySelectorAll('.dt-band').forEach((el) => el.classList.toggle('on', el._b[1] <= cursorYear && cursorYear < el._b[2]));
    stage.querySelectorAll('.dt-ev').forEach((el) => el.classList.toggle('sel', el._ev === picked));
    const [ne, pe] = describe('e', cursorYear, picked), [nw, pw] = describe('w', cursorYear, picked);
    $('ie').innerHTML = ne; $('pe').innerHTML = pe; $('iw').innerHTML = nw; $('pw').innerHTML = pw;
    if (!quiet) history.replaceState(null, '', '#' + cursorYear);
  }

  // Kéo để cuộn ngang, chạm để đặt con trỏ năm
  let down = null;
  wrap.addEventListener('pointerdown', (e) => { if (e.target.closest('.dt-ev')) return; down = { x: e.clientX, s: wrap.scrollLeft, moved: false }; });
  wrap.addEventListener('pointermove', (e) => {
    if (!down) return;
    const dx = e.clientX - down.x;
    if (Math.abs(dx) > 4) { down.moved = true; wrap.classList.add('drag'); }
    if (down.moved && e.pointerType === 'mouse') wrap.scrollLeft = down.s - dx;
  });
  wrap.addEventListener('pointerup', (e) => {
    if (down && !down.moved) {
      const r = stage.getBoundingClientRect();
      setCursor(Math.max(YMIN, Math.min(2026, yearAt(e.clientX - r.left))));
    }
    down = null; wrap.classList.remove('drag');
  });
  wrap.addEventListener('wheel', (e) => {
    if (e.ctrlKey) { e.preventDefault(); zoom(e.deltaY < 0 ? 1.25 : 0.8, e.clientX); return; }
    if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { e.preventDefault(); wrap.scrollLeft += e.deltaY; }
  }, { passive: false });

  function zoom(f, clientX) {
    const r = wrap.getBoundingClientRect();
    const px = (clientX ?? r.left + r.width / 2) - r.left;
    const yr = yearAt(wrap.scrollLeft + px);
    ppy = Math.max(fitPpy(), Math.min(6, ppy * f));
    layout();
    wrap.scrollLeft = xOf(yr) - px;
  }
  const fitPpy = () => (wrap.clientWidth - 100) / (YMAX - YMIN);
  $('zin').onclick = () => zoom(1.6);
  $('zout').onclick = () => zoom(1 / 1.6);
  $('fit').onclick = () => { ppy = fitPpy(); layout(); wrap.scrollLeft = 0; };
  addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') setCursor(Math.min(2026, cursorYear + (e.shiftKey ? 100 : 10)));
    if (e.key === 'ArrowLeft') setCursor(Math.max(YMIN, cursorYear - (e.shiftKey ? 100 : 10)));
    if (e.key === '+' || e.key === '=') zoom(1.6);
    if (e.key === '-') zoom(1 / 1.6);
  });

  const h = parseInt(location.hash.slice(1), 10);
  if (!isNaN(h)) cursorYear = Math.max(YMIN, Math.min(2026, h));
  ppy = Math.max(fitPpy(), innerWidth < 720 ? 0.45 : 0.6);
  layout();
  wrap.scrollLeft = xOf(cursorYear) - wrap.clientWidth / 2;
  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { ppy = Math.max(fitPpy(), ppy); layout(); }, 150); });
})();
</script>
<script src="/js/nen-ung-dung.js"></script>
</body>
